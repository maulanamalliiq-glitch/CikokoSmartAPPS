name: cikoko
version: 2.5.27+2527
description: Aplikasi native Kelurahan Cikoko untuk warga dan petugas.
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^19.4.2
  url_launcher: ^6.3.2
  printing: ^5.14.3
  image: 4.5.4
  archive: 4.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/kantor-cikoko.jpg
