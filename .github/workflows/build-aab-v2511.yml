name: Build Cikoko AAB 2.5.11 (2511)
on:
  workflow_dispatch:
  push:
    branches:
      - build/v2511-aab-github-actions

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Cikoko Flutter source
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper if needed
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .

      - name: Verify Play Store update identity
        working-directory: flutter
        run: |
          grep -q '^version: 2.5.11+2511$' pubspec.yaml
          grep -q 'applicationId = "com.KelurahanCikoko.malik"' android/app/build.gradle.kts
          grep -q 'versionCode = 2511' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts

      - name: Resolve and test Flutter project
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Configure upload-key signing (when GitHub Secrets exist)
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CIKOKO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" && -n "$KEY_PASS" ]]; then
            alias_name="${KEY_ALIAS:-androidkey}"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > flutter/android/app/cikoko-upload.jks
            keytool -list -keystore flutter/android/app/cikoko-upload.jks -storepass "$STORE_PASS" -alias "$alias_name" >/dev/null
            echo "CIKOKO_KEYSTORE_PATH=cikoko-upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore found. The release will be signed with the configured upload key."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured. Artifact will NOT be ready for Google Play."
          fi

      - name: Build Android App Bundle
        working-directory: flutter
        env:
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: ${{ secrets.CIKOKO_KEY_ALIAS || 'androidkey' }}
          EXPECTED_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          flutter build appbundle --release --build-name=2.5.11 --build-number=2511
          bundle="build/app/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [[ "$EXPECTED_SIGNED" == "true" ]]; then
            jarsigner -verify -strict "$bundle" >/dev/null
            cp "$bundle" "$GITHUB_WORKSPACE/out/Cikoko-v2511-PLAY-SIGNED.aab"
            printf '%s\n' "Signed with configured upload key. Verify SHA-256 against Play Console upload certificate before publishing." > "$GITHUB_WORKSPACE/out/SIGNING_STATUS.txt"
          else
            cp "$bundle" "$GITHUB_WORKSPACE/out/Cikoko-v2511-NOT-SIGNED-FOR-PLAY.aab"
            printf '%s\n' "No upload keystore configured. This AAB is NOT ready for Play Console." > "$GITHUB_WORKSPACE/out/SIGNING_STATUS.txt"
          fi
          (cd "$GITHUB_WORKSPACE/out" && sha256sum ./*.aab > SHA256SUMS.txt)

      - name: Clean up upload keystore from runner
        if: always()
        run: rm -f flutter/android/app/cikoko-upload.jks

      - name: Upload AAB build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cikoko-v2511-${{ steps.signing.outputs.signed == 'true' && 'PLAY-SIGNED' || 'NOT-SIGNED-FOR-PLAY' }}
          path: out/
          if-no-files-found: error
          retention-days: 14
