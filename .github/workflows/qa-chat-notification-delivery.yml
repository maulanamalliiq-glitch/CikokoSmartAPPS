name: QA - Private Chat Notification Delivery
on:
  push:
    branches: [fix/chat-notification-delivery-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notification-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and recipient isolation
        run: |
          php -l cpanel/mobile-api/bootstrap.php
          php -l cpanel/mobile-api/notification_recipients.php
          php -l qa/fixtures/deployed_notification_bootstrap.php
          php qa/notification_delivery_test.php
