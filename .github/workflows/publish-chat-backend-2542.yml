name: Publish 2.5.42 Chat Backend cPanel Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-chat-backend-2542.yml'
      - 'qa/backend_2541_contract_test.php'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: cikoko_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,pdo_sqlite
      - name: Check syntax and private chat permissions
        run: |
          set -euo pipefail
          for p in index.php bootstrap.php release_core.php account_support.php governance_review.php waris_review.php; do php -l "cpanel/mobile-api/$p"; done
          php qa/account_isolation_contract_test.php
          php qa/governance_review_test.php
          php qa/backend_2541_contract_test.php
      - name: Check MySQL read receipt and legacy regression
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=cikoko_test;charset=utf8mb4
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: test-only-password
        run: |
          set -euo pipefail
          php qa/release_2541_regression_test.php
          php qa/chat_receipts_2542_test.php
      - name: Create verified ZIP of only six production PHP files
        run: |
          set -euo pipefail
          mkdir -p package/mobile-api
          for p in index.php bootstrap.php release_core.php account_support.php governance_review.php waris_review.php; do cp "cpanel/mobile-api/$p" "package/mobile-api/$p"; done
          cp docs/CHAT_2542_CPANEL_DEPLOYMENT.md package/BACA_DULU_CHAT_2542.md
          (cd package && sha256sum mobile-api/*.php > SHA256SUMS.txt)
          (cd package && zip -qr ../CIKOKO_CHAT_2542_CPANEL_PATCH.zip .)
          unzip -t CIKOKO_CHAT_2542_CPANEL_PATCH.zip
      - name: Publish direct download as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v2.5.42-chat-backend-20261108"
          file="CIKOKO_CHAT_2542_CPANEL_PATCH.zip"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber --repo "$GH_REPO"
          else
            gh release create "$tag" "$file" --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --prerelease --title "Cikoko Chat Backend 2.5.42 (cPanel Overlay)" \
              --notes "PHP overlay to support private delivery and read receipts. Requires authorized cPanel installation, backups and end-to-end testing. No automatic production deployment."
          fi
