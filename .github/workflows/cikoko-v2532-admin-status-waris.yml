          actual="$(sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*/\1/p' "$GITHUB_WORKSPACE/admin-status-release-2532/APK_SIGNATURE_VERIFY.txt" | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$actual" && "$expected" == "$actual" ]] || { echo "::error::APK upload-key certificate mismatch"; exit 1; }
          cp "$src" "$GITHUB_WORKSPACE/admin-status-release-2532/Cikoko-v2532-ADMIN-TEST-SIGNED.apk"
      - name: Finalize integrity files
        run: |
          set -euo pipefail
          printf '%s\n' 'Build: Cikoko 2.5.32 (2532) - Detailed RT/RW LPJ entry forms matching user-provided A4 references (Flutter only)' 'Package: com.KelurahanCikoko.malik' 'Signing: verified existing upload key; compare fingerprint with Play Console before use' 'Status: DRAFT ONLY. Internal Testing and backend QA required.' > admin-status-release-2532/BUILD_INFORMATION.txt
          (cd admin-status-release-2532 && sha256sum ./*.aab ./*.apk > SHA256SUMS.txt)
      - name: Erase upload keystore from CI runner
        if: always()
        run: rm -f flutter/android/app/cikoko-upload.jks
      - name: Store signed AAB and APK in PRIVATE DRAFT GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="cikoko-v2.5.32-lpj-2532"
          test -s admin-status-release-2532/Cikoko-v2532-ADMIN-PLAY-SIGNED.aab
          test -s admin-status-release-2532/Cikoko-v2532-ADMIN-TEST-SIGNED.apk
