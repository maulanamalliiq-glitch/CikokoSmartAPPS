name: Cikoko LPJ Backend PHP and Flutter QA
on:
  push:
    branches:
      - feat/v2513-lpj-backend-20261027
  pull_request:
    branches:
      - feat/v2513-lpj-role-menus
permissions:
  contents: read
jobs:
  php-lpj-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Lint LPJ backend and authenticated API router
        run: |
          php -l cpanel/mobile-api/civic_lpj_v2513.php
          php -l cpanel/mobile-api/index.php
          php -l cpanel/mobile-api/bootstrap.php
          php -l cpanel/mobile-api/territory.php
      - name: Validate finance calculation and input with no database writes
        run: |
          php -r '
          function mobile_error($message,$status=400){throw new RuntimeException($message);}
          function mobile_strlen($value){return mb_strlen($value);}
          require "cpanel/mobile-api/civic_lpj_v2513.php";
          $p=lpj_payload(["opening"=>1000,"income"=>500,"entries"=>[
            ["activity"=>"Contoh kegiatan","amount"=>300,"notes"=>"Keterangan"]
          ]]);
          if($p["total_expenses"]!==300 || $p["closing"]!==1200){exit(1);}
          try{lpj_payload(["opening"=>100,"income"=>0,"entries"=>[
            ["activity"=>"Contoh kegiatan","amount"=>200,"notes"=>""]
          ]]);exit(2);}catch(RuntimeException $e){echo "Overspending correctly rejected\n";}
          echo "LPJ validation OK\n";
          '
      - name: Render PDF smoke test (no external PDF vendor)
        run: |
          php -r '
          function mobile_error($message,$status=400){throw new RuntimeException($message);}
          function mobile_strlen($value){return strlen($value);}
          require "cpanel/mobile-api/civic_lpj_v2513.php";
          lpj_pdf([
           "id"=>1,"kind"=>"lpj_lmk_a","period"=>"2026-10","rt"=>"","rw"=>"001",
           "status"=>"disahkan","revision"=>1,
           "payload"=>["opening"=>0,"income"=>1000000,
             "entries"=>[["activity"=>"Kegiatan pengujian","notes"=>"QA","amount"=>250000]],
             "total_expenses"=>250000,"closing"=>750000]
          ],[["action"=>"approve","duty"=>"lmk",
             "officer_name"=>"Petugas Uji","created_at"=>"2026-10-27"]]);
          ' > /tmp/cikoko-lpj-test.pdf
          test "$(head -c 5 /tmp/cikoko-lpj-test.pdf)" = "%PDF-"
          grep -aq "%%EOF" /tmp/cikoko-lpj-test.pdf
          echo "PDF smoke test OK"
  flutter-lpj-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter analyzer and unit tests
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
