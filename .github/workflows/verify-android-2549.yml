name: QA Android asli Cikoko v2549 (foto header website)
on:
  pull_request:
    branches: [main]
    paths:
      - 'flutter/**'
      - 'cpanel/mobile-api/index.php'
      - '.github/workflows/verify-android-2549.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: Lint endpoint publik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: php -l cpanel/mobile-api/index.php && php -l cpanel/mobile-api/app_cms.php

  flutter:
    name: Analyze and test original Cikoko APK source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: flutter
        run: flutter pub get
      - name: Static analysis
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Widget and integration contract tests
        working-directory: flutter
        run: flutter test
