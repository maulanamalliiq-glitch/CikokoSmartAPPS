name: Cikoko v2556 APK and AAB test artifacts
on:
  push:
    branches:
      - feat/qr-official-signature-2556
    paths:
      - 'flutter/**'
      - '.github/workflows/android-v2556.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Prepare Flutter Android project
        working-directory: flutter
        run: |
          flutter create --platforms=android --project-name=cikoko .
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Restore signing key and verify fingerprint
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CIKOKO_KEYSTORE_B64"
          test -n "$CIKOKO_STORE_PASSWORD"
          test -n "$CIKOKO_KEY_PASSWORD"
          printf '%s' "$CIKOKO_KEYSTORE_B64" | base64 --decode > flutter/android/cikoko_upload.jks
          actual=$(keytool -list -v -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          test "$actual" = "$expected"
      - name: Build signed AAB
        working-directory: flutter
        env:
          CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: androidkey
        run: |
          flutter build appbundle --release
          test -s build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          mkdir -p ../artifacts
          cp build/app/outputs/bundle/release/app-release.aab ../artifacts/Cikoko-v2556-PLAY-SIGNED.aab
      - name: Reclaim disk and build signed APK
        working-directory: flutter
        env:
          CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: androidkey
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose "$apk"
          cp "$apk" ../artifacts/Cikoko-v2556-RELEASE-arm64.apk
      - name: Upload APK and AAB for testing only
        uses: actions/upload-artifact@v4
        with:
          name: Cikoko-v2556-SIGNED-APK-AAB-TEST
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Delete signing key
        if: always()
        run: rm -f flutter/android/cikoko_upload.jks
