name: Cikoko LPJ RT RW LMK Flutter QA
on:
  workflow_dispatch:
  push:
    branches:
      - feat/v2513-lpj-role-menus
permissions:
  contents: read
jobs:
  android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android wrapper
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Flutter analyze and role tests
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build installation-only debug APK
        working-directory: flutter
        run: flutter build apk --debug
      - name: Upload test-only APK
        uses: actions/upload-artifact@v4
        with:
          name: Cikoko-v2513-LPJ-RT-RW-LMK-DEBUG-NOT-FOR-PLAY
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
