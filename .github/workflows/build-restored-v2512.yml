name: Cikoko 2512 RESTORED - Signed APK and AAB
on:
  workflow_dispatch:
  push:
    branches:
      - fix/v2512-restored-android-api

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Cikoko Flutter source
        uses: actions/checkout@v4

      - name: Verify compatible RT/RW API and staged Ahli Waris source
        run: |
          set -euo pipefail
          grep -Fq 'RtRwLettersPage(api:api)' flutter/lib/main.dart
          grep -Fq "'waris_stage'" flutter/lib/main.dart
          grep -Fq "cikoko_rt_rw_dispatch" cpanel/mobile-api/index.php
          grep -Fq "waris_stage_upload" cpanel/mobile-api/index.php
          if grep -Fq 'CivicAdministrationPage(api:api)' flutter/lib/main.dart; then
            echo "::error::Old civic endpoints still active."
            exit 1
          fi
          find cpanel/mobile-api -name '*.php' -print0 | xargs -0 -n1 php -l
          php qa/test_v2513_territory.php
          php qa/test_v2519_waris_stage.php
          php qa/test_v2525_identity.php

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper if needed
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .

      - name: Verify Play Store update identity
        working-directory: flutter
        run: |
          grep -q '^version: 2.5.12+2512$' pubspec.yaml
          grep -q 'applicationId = "com.KelurahanCikoko.malik"' android/app/build.gradle.kts
          grep -q 'versionCode = 2512' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts

      - name: Resolve and test Flutter project
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Configure upload-key signing (when GitHub Secrets exist)
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CIKOKO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" && -n "$KEY_PASS" ]]; then
            alias_name="${KEY_ALIAS:-androidkey}"
            if printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 --decode > flutter/android/app/cikoko-upload.jks \
               && keytool -list -keystore flutter/android/app/cikoko-upload.jks -storepass "$STORE_PASS" -alias "$alias_name" >/dev/null 2>&1; then
              echo "CIKOKO_KEYSTORE_PATH=cikoko-upload.jks" >> "$GITHUB_ENV"
              echo "signed=true" >> "$GITHUB_OUTPUT"
              echo "Keystore verified. Release will use configured upload key."
            else
              rm -f flutter/android/app/cikoko-upload.jks
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Keystore Base64 or alias/password is invalid. AAB will be generated but NOT signed for Play."
            fi
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured. Artifact will NOT be ready for Google Play."
          fi

      - name: Build Android App Bundle
        working-directory: flutter
        env:
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: ${{ secrets.CIKOKO_KEY_ALIAS || 'androidkey' }}
          EXPECTED_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          flutter build appbundle --release --build-name=2.5.12 --build-number=2512
          bundle="build/app/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [[ "$EXPECTED_SIGNED" == "true" ]]; then
            # Verify signature integrity and that the signer matches our upload-key alias.
            # Do not use -strict: self-signed upload certificates trigger exit code 4.
            jarsigner -verify -verbose:summary -certs \
              -keystore "android/app/${CIKOKO_KEYSTORE_PATH}" \
              -storepass:env CIKOKO_STORE_PASSWORD \
              "$bundle" "$CIKOKO_KEY_ALIAS" > "$GITHUB_WORKSPACE/out/SIGNATURE_VERIFY.txt" 2>&1
            tail -n 30 "$GITHUB_WORKSPACE/out/SIGNATURE_VERIFY.txt"
            grep -Fq "jar verified." "$GITHUB_WORKSPACE/out/SIGNATURE_VERIFY.txt" || {
              echo "::error::AAB failed signature verification."
              exit 1
            }
            grep -Fq "(${CIKOKO_KEY_ALIAS})" "$GITHUB_WORKSPACE/out/SIGNATURE_VERIFY.txt" || {
              echo "::error::AAB signer does not match configured keystore alias."
              exit 1
            }
            keytool -exportcert -alias "$CIKOKO_KEY_ALIAS" -keystore "android/app/${CIKOKO_KEYSTORE_PATH}" -storepass "$CIKOKO_STORE_PASSWORD" | openssl x509 -inform DER -noout -fingerprint -sha256 > "$GITHUB_WORKSPACE/out/UPLOAD_CERT_SHA256.txt"
            cp "$bundle" "$GITHUB_WORKSPACE/out/Cikoko-v2512-RESTORED-PLAY-SIGNED.aab"
            printf '%s\n' "Signed with configured upload key. Verify SHA-256 against Play Console upload certificate before publishing." > "$GITHUB_WORKSPACE/out/SIGNING_STATUS.txt"
          else
            cp "$bundle" "$GITHUB_WORKSPACE/out/Cikoko-v2512-NOT-SIGNED-FOR-PLAY.aab"
            printf '%s\n' "No upload keystore configured. This AAB is NOT ready for Play Console." > "$GITHUB_WORKSPACE/out/SIGNING_STATUS.txt"
          fi
          (cd "$GITHUB_WORKSPACE/out" && sha256sum ./*.aab > SHA256SUMS.txt)

      - name: Build signed test APK and validate upload signer
        if: steps.signing.outputs.signed == 'true'
        working-directory: flutter
        env:
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: ${{ secrets.CIKOKO_KEY_ALIAS || 'androidkey' }}
        run: |
          set -euo pipefail
          flutter build apk --release --build-name=2.5.12 --build-number=2512
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$GITHUB_WORKSPACE/out/APK_SIGNATURE_VERIFY.txt"
          expected="$(keytool -exportcert -alias "$CIKOKO_KEY_ALIAS" -keystore "android/app/$CIKOKO_KEYSTORE_PATH" -storepass "$CIKOKO_STORE_PASSWORD" 2>/dev/null | sha256sum | awk '{print $1}')"
          actual="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*/\\1/p' "$GITHUB_WORKSPACE/out/APK_SIGNATURE_VERIFY.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$actual" && "$actual" == "$expected" ]] || { echo "::error::APK signer certificate mismatch"; exit 1; }
          cp "$apk" "$GITHUB_WORKSPACE/out/Cikoko-v2512-RESTORED-TEST-SIGNED.apk"
          (cd "$GITHUB_WORKSPACE/out" && sha256sum Cikoko-v2512-RESTORED-TEST-SIGNED.apk > APK_SHA256SUMS.txt)

      - name: Clean up upload keystore from runner
        if: always()
        run: rm -f flutter/android/app/cikoko-upload.jks

      - name: Store signed AAB and APK as private draft GitHub Release assets
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="cikoko-v2.5.12-restored-2512"
          test -s out/Cikoko-v2512-RESTORED-PLAY-SIGNED.aab
          test -s out/SHA256SUMS.txt
          test -s out/UPLOAD_CERT_SHA256.txt
          test -s out/Cikoko-v2512-RESTORED-TEST-SIGNED.apk
          NOTES="Build source: fix/v2512-restored-android-api (based on modern corrected source).
          Package: com.KelurahanCikoko.malik.
          Version: 2.5.12 (2512), Android target SDK 36.
          Draft release: not published to users.
          Check the upload key SHA-256 against Google Play Console before uploading."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/Cikoko-v2512-RESTORED-PLAY-SIGNED.aab out/SHA256SUMS.txt out/UPLOAD_CERT_SHA256.txt out/SIGNING_STATUS.txt out/SIGNATURE_VERIFY.txt out/Cikoko-v2512-RESTORED-TEST-SIGNED.apk out/APK_SHA256SUMS.txt out/APK_SIGNATURE_VERIFY.txt out/Cikoko-v2512-RESTORED-TEST-SIGNED.apk out/APK_SHA256SUMS.txt out/APK_SIGNATURE_VERIFY.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/Cikoko-v2512-RESTORED-PLAY-SIGNED.aab out/SHA256SUMS.txt out/UPLOAD_CERT_SHA256.txt out/SIGNING_STATUS.txt out/SIGNATURE_VERIFY.txt out/Cikoko-v2512-RESTORED-TEST-SIGNED.apk out/APK_SHA256SUMS.txt out/APK_SIGNATURE_VERIFY.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Cikoko 2.5.12 (2512) - RESTORED TEST APK and AAB" \
              --notes "$NOTES" \
              --draft
          fi
          echo "Signed AAB and APK stored in private draft release: $TAG"

      - name: Block distribution of unsigned bundle
        if: steps.signing.outputs.signed != 'true'
        run: |
          echo "::error::Upload signing was not verified. No Play Store release created."
          exit 1
