name: Cikoko Web Integration and Patch
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'cpanel/**'
      - 'qa/**'
      - '.github/workflows/cpanel-patch.yml'
permissions:
  contents: read
jobs:
  php-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax hardcheck
        run: |
          find cpanel qa -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Server-to-Flutter static integration contracts
        run: php qa/v212_contract_test.php
      - name: Prepare production-safe cPanel overlay
        run: |
          mkdir -p build/cpanel-v2500/mobile-api build/cpanel-v2500/assets
          for p in index.php v211.php v211_migration.sql v2500_migration.sql permissions.php bootstrap.php cron_dispatch.php; do
            cp "cpanel/mobile-api/$p" "build/cpanel-v2500/mobile-api/$p"
          done
          cp cpanel/assets/mobile-chat.js build/cpanel-v2500/assets/mobile-chat.js
          for p in inovasi.php kelola-inovasi.php berita-galeri.php kelola-berita-galeri.php kelola-arsip-waris-v211.php; do
            cp "cpanel/$p" "build/cpanel-v2500/$p"
          done
          printf '%s\n' \
            'CIKOKO BUILD 2500 - PATCH CPANEL' \
            '1. Backup public_html, folder data, foto private, dan database MySQL.' \
            '2. Ekstrak ke root website sejajar admin.php; jangan hapus file lama.' \
            '3. Jika perlu, impor v211_migration.sql dan v2500_migration.sql lewat phpMyAdmin.' \
            '4. Uji arsip, inovasi, berita, komentar, profil, chat, dan PPSU.' \
            '5. Push saat aplikasi ditutup memerlukan Firebase service account dan cron aktif.' \
            > build/cpanel-v2500/BACA_DULU_PATCH_V2500.txt
          cd build/cpanel-v2500 && zip -r -q ../CIKOKO_V2500_CPANEL_PATCH.zip .
      - name: Publish cPanel patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIKOKO-V2500-CPANEL-WEBSITE-AND-SQL
          path: build/CIKOKO_V2500_CPANEL_PATCH.zip
          retention-days: 14
          if-no-files-found: error

      - name: Prepare dedicated V2514 RT/RW overlay
        run: |
          mkdir -p build/cikoko-v2514/mobile-api
          for file in index.php v211.php territory.php rt_rw_letters.php; do
            cp "cpanel/mobile-api/$file" "build/cikoko-v2514/mobile-api/$file"
          done
          cp V2514_RELEASE_NOTES.md build/cikoko-v2514/BACA_DULU_V2514.md
          (cd build/cikoko-v2514 && zip -q -r ../CIKOKO_V2514_CPANEL_RT_RW_PATCH.zip .)
          unzip -t build/CIKOKO_V2514_CPANEL_RT_RW_PATCH.zip
      - name: Upload dedicated V2514 RT/RW cPanel patch
        uses: actions/upload-artifact@v4
        with:
          name: CIKOKO-V2514-CPANEL-RT-RW-PATCH
          path: build/CIKOKO_V2514_CPANEL_RT_RW_PATCH.zip
          retention-days: 14
          if-no-files-found: error
