name: Publish Cikoko Website and cPanel Code-Only 2546
on:
  push:
    branches: [release/2.5.46-full-hardcheck-20261109]
    paths: ['.github/workflows/publish-cpanel-website-2546.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-verified-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: cikoko_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,pdo_sqlite
      - name: Check website, admin, API, report code and account permissions
        run: |
          set -euo pipefail
          find cpanel -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php qa/backend_2541_contract_test.php
          php qa/account_isolation_contract_test.php
          php qa/asn_permissions_test.php
          php qa/governance_review_test.php
      - name: MySQL hardcheck citizen report, chat, receipts and staff bot
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=cikoko_test;charset=utf8mb4
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: test-only-password
        run: |
          set -euo pipefail
          php qa/release_2541_regression_test.php
          php qa/chat_receipts_2542_test.php
          php qa/chat_storage_2544_integration_test.php
          php qa/offline_chat_bot_2545_test.php
          php qa/report_integrity_2546_test.php
      - name: Build code-only overlay (no resident data/config/passwords)
        run: |
          set -euo pipefail
          mkdir -p package/public_html/assets package/public_html/mobile-api package/PANDUAN
          cp cpanel/index.php package/public_html/index.php
          cp cpanel/assets/cikoko-smartapp-home-2546.css package/public_html/assets/
          cp cpanel/assets/cikoko-smartapp-home-2546.js package/public_html/assets/
          cp cpanel/mobile-api/index.php package/public_html/mobile-api/index.php
          cp cpanel/mobile-api/report_integrity_2546.php package/public_html/mobile-api/
          cp docs/DEPLOY_CPANEL_WEBSITE_2546.md package/PANDUAN/MULAI_DI_SINI_2546.md
          cp docs/DB_READ_ONLY_2546.sql package/PANDUAN/
          cp scripts/check_cpanel_permissions_2546.sh package/PANDUAN/
          chmod 644 package/public_html/index.php package/public_html/assets/* package/public_html/mobile-api/*
          (cd package && sha256sum public_html/index.php public_html/assets/* public_html/mobile-api/* > SHA256SUMS.txt)
          (cd package && sha256sum -c SHA256SUMS.txt)
          (cd package && zip -qr ../CIKOKO_CPANEL_WEBSITE_2546_OVERLAY_KODE.zip .)
          unzip -t CIKOKO_CPANEL_WEBSITE_2546_OVERLAY_KODE.zip
      - name: Create verified direct GitHub release URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v2.5.46-cpanel-website-20261109'
          asset='CIKOKO_CPANEL_WEBSITE_2546_OVERLAY_KODE.zip'
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1;then
            gh release upload "$tag" "$asset" --clobber --repo "$GH_REPO"
          else
            gh release create "$tag" "$asset" --repo "$GH_REPO" \
              --target "$GITHUB_SHA" --prerelease \
              --title 'Cikoko Website and cPanel 2546 — Hardcheck Code Overlay' \
              --notes 'Only 5 source files and deployment instructions; no private data, credentials, or database. Website app-style homepage, MySQL-verified report insert, Apache 403 permission checks. This release does NOT install files on cPanel. Mandatory staged rollout and device testing before production.'
          fi
