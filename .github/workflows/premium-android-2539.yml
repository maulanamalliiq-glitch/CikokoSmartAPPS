name: Premium UI 2539 - Release ARM64 APK and Play AAB
on:
  push:
    branches:
      - design/premium-minimalist-ui
    paths:
      - 'flutter/**'
      - '.github/workflows/premium-android-2539.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-android-2539-${{ github.ref }}
  cancel-in-progress: true

jobs:
  premium-android:
    if: github.ref == 'refs/heads/design/premium-minimalist-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore generated Android project files
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Check version and package
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 2.5.39+2539$' flutter/pubspec.yaml
          grep -q 'versionCode = 2539' flutter/android/app/build.gradle.kts
          grep -q 'versionName = "2.5.39"' flutter/android/app/build.gradle.kts
          grep -q 'applicationId = "com.KelurahanCikoko.malik"' flutter/android/app/build.gradle.kts
      - name: Install, analyze and test
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Verify Play signing secrets are configured
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CIKOKO_KEYSTORE_B64" || -z "$CIKOKO_STORE_PASSWORD" || -z "$CIKOKO_KEY_PASSWORD" ]]; then
            echo "::warning::Play upload signing secrets missing: no Play-ready AAB will be built."
            echo "SIGN_READY=false" >> "$GITHUB_ENV"
          else
            printf '%s' "$CIKOKO_KEYSTORE_B64" | base64 --decode > flutter/android/cikoko_upload.jks
            chmod 600 flutter/android/cikoko_upload.jks
            test -s flutter/android/cikoko_upload.jks
            echo "SIGN_READY=true" >> "$GITHUB_ENV"
          fi
      - name: Validate expected Play upload certificate
        if: env.SIGN_READY == 'true'
        env:
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          actual=$(keytool -list -v -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Unexpected Play upload signing certificate."
            exit 1
          fi
      - name: Build Play-signed Android App Bundle
        if: env.SIGN_READY == 'true'
        working-directory: flutter
        env:
          CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: androidkey
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$aab"
          jarsigner -verify "$aab" > /tmp/cikoko-premium-signature.log 2>&1
          grep -q 'jar verified' /tmp/cikoko-premium-signature.log
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          test "$actual" = "$expected"
          mkdir -p ../premium-outputs
          cp "$aab" ../premium-outputs/Cikoko-Premium-2539-PLAY-SIGNED.aab
      - name: Build compact ARM64 release APK
        if: env.SIGN_READY == 'true'
        working-directory: flutter
        env:
          CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: androidkey
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          mkdir -p ../premium-outputs
          output="../premium-outputs/Cikoko-Premium-2539-RELEASE-arm64.apk"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" sign \
            --ks "$CIKOKO_KEYSTORE_PATH" \
            --ks-key-alias "$CIKOKO_KEY_ALIAS" \
            --ks-pass env:CIKOKO_STORE_PASSWORD \
            --key-pass env:CIKOKO_KEY_PASSWORD \
            --out "$output" "$apk"
          "$apksigner" verify --verbose --print-certs "$output" > /tmp/cikoko-premium-apk-signature.log
          actual=$(grep -iE 'certificate.*SHA.?256' /tmp/cikoko-premium-apk-signature.log | grep -oiE '[0-9a-f]{64}|([0-9a-f]{2}:){31}[0-9a-f]{2}' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          test "$actual" = "$expected"
          ls -lh "$output"
      - name: Upload isolated QA outputs (never replace production release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cikoko-premium-2539-${{ github.run_number }}
          path: premium-outputs/*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f flutter/android/cikoko_upload.jks
