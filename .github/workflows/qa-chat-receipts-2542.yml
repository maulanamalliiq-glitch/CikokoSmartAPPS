name: QA Chat Status 2542 - Delivery, Read, Privacy
on:
  push:
    branches: [fix/chat-receipts-20261108]
    paths: ['cpanel/mobile-api/**','qa/chat_receipts_2542_test.php','qa/governance_review_test.php','.github/workflows/qa-chat-receipts-2542.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chat-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: cikoko_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,pdo_sqlite
      - name: Syntax check all affected backend and QA PHP files
        run: |
          set -euo pipefail
          find cpanel/mobile-api -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l qa/chat_receipts_2542_test.php
      - name: Role, account isolation, governance, existing chat privacy
        run: |
          set -euo pipefail
          php qa/account_isolation_contract_test.php
          php qa/asn_permissions_test.php
          php qa/governance_review_test.php
          php qa/backend_2541_contract_test.php
      - name: MySQL sender/delivery/read/pagination/isolated-account receipts
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=cikoko_test;charset=utf8mb4
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: test-only-password
        run: |
          php qa/release_2541_regression_test.php
          php qa/chat_receipts_2542_test.php
