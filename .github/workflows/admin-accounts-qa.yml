name: Cikoko Bendahara and Admin Accounts QA
on:
  push:
    branches:
      - feat/v2527-bendahara-admin-akun
  pull_request:
    branches:
      - build/v2526-lpj-playstore
permissions:
  contents: read
jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and authenticated account management checks
        run: |
          php -l cpanel/mobile-api/admin_accounts.php
          php -l cpanel/mobile-api/index.php
          php -l cpanel/mobile-api/permissions.php
          php -l cpanel/mobile-api/civic_lpj_v2513.php
          php -l cpanel/roles-lib.php
  flutter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze Flutter and run tests
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
