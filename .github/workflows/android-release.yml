name: Build Android v2535 (GitHub Release Downloads)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/android-release.yml'

# Keep only the latest v2535 build running to prevent older commits
# from replacing the downloadable APK in the same GitHub Release.
concurrency:
  group: cikoko-android-2535-${{ github.ref }}
  cancel-in-progress: true

# Release uploads are separate from GitHub Actions artifact quota.
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk for Android / AAB
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          for directory in \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator; do
            if [[ -d "$directory" ]]; then
              echo "Removing unused Android-unrelated tools: $directory"
              sudo rm -rf "$directory"
            fi
          done
          echo "Disk after cleanup:"
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android project files
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Install dependencies and analyze
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build test APK
        working-directory: flutter
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p "$GITHUB_WORKSPACE/cikoko-downloads"
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/cikoko-downloads/Cikoko-v2535-TEST.apk"
      - name: Publish test APK immediately to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v2.5.35-build2535"
          apk="cikoko-downloads/Cikoko-v2535-TEST.apk"
          test -s "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Cikoko SmartApp v2.5.35 (2535) APK + AAB" --notes "APK TEST v2535 sudah tersedia. APK bertanda tangan Play Store dan AAB akan ditambahkan jika pemeriksaan build release berhasil. Gunakan APK TEST hanya untuk pengujian, bukan pembaruan langsung Play Store."
          fi
          gh release view "$tag" --json url,assets --jq '{url: .url, filenames: [.assets[].name]}'
      - name: Run Flutter tests before Play release
        working-directory: flutter
        run: flutter test
      - name: Clear debug build outputs before release AAB
        working-directory: flutter
        shell: bash
        run: |
          echo "Disk before Flutter cleanup:"
          df -h /
          flutter clean
          flutter pub get
          echo "Disk after Flutter cleanup:"
          df -h /
      - name: Restore Play upload signing key if configured
        shell: bash
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
        run: |
          if [[ -z "$CIKOKO_KEYSTORE_B64" || -z "$CIKOKO_STORE_PASSWORD" || -z "$CIKOKO_KEY_PASSWORD" ]]; then
            echo "CIKOKO_SIGN_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Upload signing secrets missing. Only test APK and unsigned AAB can be distributed."
            exit 0
          fi
          printf '%s' "$CIKOKO_KEYSTORE_B64" | base64 --decode > flutter/android/cikoko_upload.jks
          test -s flutter/android/cikoko_upload.jks
          keytool -list -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey > /dev/null
          echo "CIKOKO_SIGN_READY=true" >> "$GITHUB_ENV"
      - name: Verify Play upload certificate fingerprint
        if: env.CIKOKO_SIGN_READY == 'true'
        shell: bash
        env:
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
        run: |
          actual=$(keytool -list -v -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Play upload certificate fingerprint did not match. Release stopped to protect existing Play Store app."
            exit 1
          fi
      - name: Build signed Play Store AAB and release APK
        if: env.CIKOKO_SIGN_READY == 'true'
        working-directory: flutter
        env:
          CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: androidkey
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Free disk before release AAB:"
          df -h /
          flutter build appbundle --release
          aab="build/app/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          # Self-signed upload certificates are expected. Verify the JAR
          # signature and the exact known Play upload signing certificate.
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          if ! jarsigner -verify "$aab" > /tmp/cikoko-aab-verify.log 2>&1; then
            tail -n 35 /tmp/cikoko-aab-verify.log
            echo "::error::AAB signature verification failed."
            exit 1
          fi
          if ! grep -q "jar verified" /tmp/cikoko-aab-verify.log; then
            tail -n 35 /tmp/cikoko-aab-verify.log
            echo "::error::AAB did not report a verified JAR signature."
            exit 1
          fi
          aab_fingerprint=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [[ "$aab_fingerprint" != "$expected" ]]; then
            echo "::error::AAB signer is not the expected Play upload certificate."
            exit 1
          fi
          # A verified AAB is safe to publish even if the separate APK
          # signing stage fails; this does not use the full Actions artifact quota.
          cp "$aab" "$GITHUB_WORKSPACE/cikoko-downloads/Cikoko-v2535-PLAY-SIGNED.aab"
          gh release upload "v2.5.35-build2535" \
            "$GITHUB_WORKSPACE/cikoko-downloads/Cikoko-v2535-PLAY-SIGNED.aab" --clobber
          # Signed AAB is safely published. Recover space before APK build.
          echo "Disk before AAB output cleanup:"
          df -h /
          flutter clean
          flutter pub get
          echo "Disk after AAB output cleanup:"
          df -h /
          flutter build apk --release --split-per-abi --target-platform android-arm64
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$apk"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          signed_apk="$GITHUB_WORKSPACE/cikoko-downloads/Cikoko-v2535-RELEASE-arm64.apk"
          # Explicitly sign the APK with the same verified upload key instead of
          # trusting the APK produced by Flutter/Gradle to use that key.
          # Passwords are read from protected environment variables, not argv.
          "$apksigner" sign \
            --ks "$CIKOKO_KEYSTORE_PATH" \
            --ks-key-alias "$CIKOKO_KEY_ALIAS" \
            --ks-pass env:CIKOKO_STORE_PASSWORD \
            --key-pass env:CIKOKO_KEY_PASSWORD \
            --out "$signed_apk" "$apk"
          "$apksigner" verify --verbose --print-certs "$signed_apk" > /tmp/cikoko-apk-verify.log
          apk_fingerprint=$(sed -n -E 's/^[[:space:]]*Signer #1 certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F:]+).*$/\1/p' /tmp/cikoko-apk-verify.log | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [[ -z "$apk_fingerprint" || "$apk_fingerprint" != "$expected" ]]; then
            echo "::error::APK certificate verification failed after explicit signing."
            echo "Expected SHA-256: $expected"
            echo "Actual SHA-256: ${apk_fingerprint:-NOT_FOUND}"
            exit 1
          fi
          echo "AAB and APK signatures verified against the expected upload certificate."
      - name: Build clearly labeled unsigned AAB if no upload key
        if: env.CIKOKO_SIGN_READY != 'true'
        working-directory: flutter
        run: |
          flutter build appbundle --release
          test -s build/app/outputs/bundle/release/app-release.aab
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/cikoko-downloads/Cikoko-v2535-UNSIGNED-NOT-FOR-PLAY.aab"
      - name: Publish APK and AAB directly to GitHub Release (no Artifacts quota)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v2.5.35-build2535"
          files=(cikoko-downloads/*)
          test -s "cikoko-downloads/Cikoko-v2535-TEST.apk"
          cat > /tmp/cikoko-release-notes.md <<'NOTES'
          Cikoko SmartApp v2.5.35 (versionCode 2535)

          - APK TEST: untuk pengujian manual di Android. Ini debug APK, bukan pembaruan langsung dari Play Store.
          - PLAY-SIGNED.aab: hanya tersedia jika signing upload Play Store berhasil diverifikasi.
          - RELEASE-arm64.apk: tersedia jika signing release berhasil.
          - UNSIGNED-NOT-FOR-PLAY.aab: belum ditandatangani. JANGAN diunggah ke Play Console.

          Rilis aplikasi ini tidak otomatis memperbarui backend cPanel. Pasang patch cPanel secara terpisah.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file /tmp/cikoko-release-notes.md
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Cikoko SmartApp v2.5.35 (2535) APK + AAB" --notes-file /tmp/cikoko-release-notes.md
          fi
          gh release view "$tag" --json url,assets --jq '{url: .url, filenames: [.assets[].name]}'
      - name: Remove private keystore from build environment
        if: always()
        run: rm -f flutter/android/cikoko_upload.jks
