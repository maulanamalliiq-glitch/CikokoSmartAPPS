name: Cikoko Android APK dan AAB
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/android-release.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android wrapper files
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Resolve dependencies and analyze source
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter widget and role tests
        working-directory: flutter
        run: flutter test
      - name: Build Android debug test APK
        working-directory: flutter
        run: flutter build apk --debug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Cikoko-v2511-TEST-APK
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build release AAB and APK for secure offline signing
        working-directory: flutter
        run: |
          # R8 obfuscates Android DEX (Gradle release build type).
          # Flutter obfuscates Dart AOT symbols independently.
          flutter build appbundle --release --obfuscate --split-debug-info=build/cikoko-symbols
          flutter build apk --release --split-per-abi --target-platform android-arm64 --obfuscate --split-debug-info=build/cikoko-symbols
          test -s build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/mapping/release/mapping.txt
          test -d build/cikoko-symbols
      - name: Stage unsigned release outputs and Android signer
        run: |
          mkdir -p flutter/build/offline-release
          cp flutter/build/app/outputs/bundle/release/app-release.aab flutter/build/offline-release/Cikoko-v2510-unsigned.aab
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk flutter/build/offline-release/Cikoko-v2510-arm64-unsigned.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)
          test -n "$SIGNER"
          cp "$SIGNER" flutter/build/offline-release/apksigner.jar
      - name: Upload offline signing artifacts (unsigned, not for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Cikoko-v2510-OFFLINE-SIGNING-APK-AAB
          path: flutter/build/offline-release/
          if-no-files-found: error
          retention-days: 7
      - name: Retain R8 mapping and Dart debug symbols for crash analysis
        uses: actions/upload-artifact@v4
        with:
          name: Cikoko-v2510-SYMBOLS-MAPPING
          path: |
            flutter/build/app/outputs/mapping/release/mapping.txt
            flutter/build/cikoko-symbols/
          if-no-files-found: error
          retention-days: 90
