name: Build Android v2532 (GitHub Release Downloads)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/android-release.yml'

# Release uploads are separate from GitHub Actions artifact quota.
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android project files
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Install dependencies and analyze
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        working-directory: flutter
        run: flutter test
      - name: Build test APK
        working-directory: flutter
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p build/cikoko-downloads
          cp build/app/outputs/flutter-apk/app-debug.apk build/cikoko-downloads/Cikoko-v2532-TEST.apk
      - name: Restore Play upload signing key if configured
        shell: bash
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
        run: |
          if [[ -z "$CIKOKO_KEYSTORE_B64" || -z "$CIKOKO_STORE_PASSWORD" || -z "$CIKOKO_KEY_PASSWORD" ]]; then
            echo "CIKOKO_SIGN_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Upload signing secrets missing. Only test APK and unsigned AAB can be distributed."
            exit 0
          fi
          printf '%s' "$CIKOKO_KEYSTORE_B64" | base64 --decode > flutter/android/cikoko_upload.jks
          test -s flutter/android/cikoko_upload.jks
          keytool -list -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey > /dev/null
          echo "CIKOKO_SIGN_READY=true" >> "$GITHUB_ENV"
      - name: Verify Play upload certificate fingerprint
        if: env.CIKOKO_SIGN_READY == 'true'
        shell: bash
        env:
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
        run: |
          actual=$(keytool -list -v -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Play upload certificate fingerprint did not match. Release stopped to protect existing Play Store app."
            exit 1
          fi
      - name: Build signed Play Store AAB and release APK
        if: env.CIKOKO_SIGN_READY == 'true'
        working-directory: flutter
        env:
          CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: androidkey
        run: |
          flutter build appbundle --release
          flutter build apk --release --split-per-abi --target-platform android-arm64
          test -s build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          jarsigner -verify -strict build/app/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          cp build/app/outputs/bundle/release/app-release.aab build/cikoko-downloads/Cikoko-v2532-PLAY-SIGNED.aab
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/cikoko-downloads/Cikoko-v2532-RELEASE-arm64.apk
      - name: Build clearly labeled unsigned AAB if no upload key
        if: env.CIKOKO_SIGN_READY != 'true'
        working-directory: flutter
        run: |
          flutter build appbundle --release
          test -s build/app/outputs/bundle/release/app-release.aab
          cp build/app/outputs/bundle/release/app-release.aab build/cikoko-downloads/Cikoko-v2532-UNSIGNED-NOT-FOR-PLAY.aab
      - name: Publish APK and AAB directly to GitHub Release (no Artifacts quota)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v2.5.32-build2532"
          files=(flutter/build/cikoko-downloads/*)
          test -s "flutter/build/cikoko-downloads/Cikoko-v2532-TEST.apk"
          cat > /tmp/cikoko-release-notes.md <<'NOTES'
          Cikoko SmartApp v2.5.32 (versionCode 2532)

          - APK TEST: untuk pengujian manual di Android. Ini debug APK, bukan pembaruan langsung dari Play Store.
          - PLAY-SIGNED.aab: hanya tersedia jika signing upload Play Store berhasil diverifikasi.
          - RELEASE-arm64.apk: tersedia jika signing release berhasil.
          - UNSIGNED-NOT-FOR-PLAY.aab: belum ditandatangani. JANGAN diunggah ke Play Console.

          Rilis aplikasi ini tidak otomatis memperbarui backend cPanel. Pasang patch cPanel secara terpisah.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file /tmp/cikoko-release-notes.md
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Cikoko SmartApp v2.5.32 (2532) APK + AAB" --notes-file /tmp/cikoko-release-notes.md
          fi
          gh release view "$tag" --json url,assets --jq '{url: .url, filenames: [.assets[].name]}'
      - name: Remove private keystore from build environment
        if: always()
        run: rm -f flutter/android/cikoko_upload.jks
