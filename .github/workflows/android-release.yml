name: Cikoko Android APK dan AAB
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/android-release.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint and RT/RW permission regression tests
        run: |
          php -v
          find cpanel/mobile-api -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php qa/test_v2513_territory.php
          php qa/test_v2516_waris_documents.php
          php qa/test_v2519_waris_stage.php
          php qa/test_v2520_public_letters.php
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android wrapper files
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Resolve dependencies and analyze source
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter widget and role tests
        working-directory: flutter
        run: flutter test
      - name: Build V2520 release bundle and universal APK
        working-directory: flutter
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out-v2520"
          flutter build appbundle --release
          test -s build/app/outputs/bundle/release/app-release.aab
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out-v2520/Cikoko-v2520-unsigned.aab"
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/out-v2520/Cikoko-v2520-universal-unsigned.apk"
          test -s "$GITHUB_WORKSPACE/out-v2520/Cikoko-v2520-unsigned.aab"
          test -s "$GITHUB_WORKSPACE/out-v2520/Cikoko-v2520-universal-unsigned.apk"
          # Keep official SDK signing utilities as internal CI artifact for signing offline.
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER_JAR=$(find "$SDK_ROOT/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -s "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" "$GITHUB_WORKSPACE/out-v2520/apksigner.jar"
      - name: Upload V2520 release for local signing
        uses: actions/upload-artifact@v4
        with:
          name: Cikoko-v2520-ANDROID-RELEASE-UNSIGNED
          path: out-v2520/
          if-no-files-found: error
          retention-days: 14
