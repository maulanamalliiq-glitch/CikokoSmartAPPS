name: Build Android v2534 (GitHub Release Downloads)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/android-release.yml'

# Release uploads are separate from GitHub Actions artifact quota.
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android project files
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Install dependencies and analyze
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build test APK
        working-directory: flutter
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p build/cikoko-downloads
          cp build/app/outputs/flutter-apk/app-debug.apk build/cikoko-downloads/Cikoko-v2534-TEST.apk
      - name: Publish test APK immediately to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v2.5.34-build2534"
          apk="flutter/build/cikoko-downloads/Cikoko-v2534-TEST.apk"
          test -s "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Cikoko SmartApp v2.5.34 (2534) APK + AAB" --notes "APK TEST v2534 sudah tersedia. APK bertanda tangan Play Store dan AAB akan ditambahkan jika pemeriksaan build release berhasil. Gunakan APK TEST hanya untuk pengujian, bukan pembaruan langsung Play Store."
          fi
          gh release view "$tag" --json url,assets --jq '{url: .url, filenames: [.assets[].name]}'
      - name: Run Flutter tests before Play release
        working-directory: flutter
        run: flutter test
      - name: Restore Play upload signing key if configured
        shell: bash
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
        run: |
          if [[ -z "$CIKOKO_KEYSTORE_B64" || -z "$CIKOKO_STORE_PASSWORD" || -z "$CIKOKO_KEY_PASSWORD" ]]; then
            echo "CIKOKO_SIGN_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Upload signing secrets missing. Only test APK and unsigned AAB can be distributed."
            exit 0
          fi
          printf '%s' "$CIKOKO_KEYSTORE_B64" | base64 --decode > flutter/android/cikoko_upload.jks
          test -s flutter/android/cikoko_upload.jks
          keytool -list -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey > /dev/null
          echo "CIKOKO_SIGN_READY=true" >> "$GITHUB_ENV"
      - name: Verify Play upload certificate fingerprint
        if: env.CIKOKO_SIGN_READY == 'true'
        shell: bash
        env:
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
        run: |
          actual=$(keytool -list -v -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Play upload certificate fingerprint did not match. Release stopped to protect existing Play Store app."
            exit 1
          fi
      - name: Build signed Play Store AAB and release APK
        if: env.CIKOKO_SIGN_READY == 'true'
        working-directory: flutter
        env:
          CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: androidkey
        run: |
          flutter build appbundle --release
          flutter build apk --release --split-per-abi --target-platform android-arm64
          test -s build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          # Self-signed Play upload certificates trigger jarsigner -strict exit code 4.
          # Verify the JAR signature without strict certificate-chain trust, then
          # independently compare BOTH output signers to the known Play upload key.
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          if ! jarsigner -verify "$aab" > /tmp/cikoko-aab-verify.log 2>&1; then
            tail -n 35 /tmp/cikoko-aab-verify.log
            echo "::error::AAB signature verification failed."
            exit 1
          fi
          if ! grep -q "jar verified" /tmp/cikoko-aab-verify.log; then
            tail -n 35 /tmp/cikoko-aab-verify.log
            echo "::error::AAB did not report a verified JAR signature."
            exit 1
          fi
          aab_fingerprint=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [[ "$aab_fingerprint" != "$expected" ]]; then
            echo "::error::AAB signer is not the expected Play upload certificate."
            exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" > /tmp/cikoko-apk-verify.log
          apk_fingerprint=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/cikoko-apk-verify.log | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [[ "$apk_fingerprint" != "$expected" ]]; then
            echo "::error::APK signer is not the expected Play upload certificate."
            exit 1
          fi
          echo "AAB and APK signatures verified and match the expected Play upload key."
          cp build/app/outputs/bundle/release/app-release.aab build/cikoko-downloads/Cikoko-v2534-PLAY-SIGNED.aab
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/cikoko-downloads/Cikoko-v2534-RELEASE-arm64.apk
      - name: Build clearly labeled unsigned AAB if no upload key
        if: env.CIKOKO_SIGN_READY != 'true'
        working-directory: flutter
        run: |
          flutter build appbundle --release
          test -s build/app/outputs/bundle/release/app-release.aab
          cp build/app/outputs/bundle/release/app-release.aab build/cikoko-downloads/Cikoko-v2534-UNSIGNED-NOT-FOR-PLAY.aab
      - name: Publish APK and AAB directly to GitHub Release (no Artifacts quota)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v2.5.34-build2534"
          files=(flutter/build/cikoko-downloads/*)
          test -s "flutter/build/cikoko-downloads/Cikoko-v2534-TEST.apk"
          cat > /tmp/cikoko-release-notes.md <<'NOTES'
          Cikoko SmartApp v2.5.34 (versionCode 2534)

          - APK TEST: untuk pengujian manual di Android. Ini debug APK, bukan pembaruan langsung dari Play Store.
          - PLAY-SIGNED.aab: hanya tersedia jika signing upload Play Store berhasil diverifikasi.
          - RELEASE-arm64.apk: tersedia jika signing release berhasil.
          - UNSIGNED-NOT-FOR-PLAY.aab: belum ditandatangani. JANGAN diunggah ke Play Console.

          Rilis aplikasi ini tidak otomatis memperbarui backend cPanel. Pasang patch cPanel secara terpisah.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file /tmp/cikoko-release-notes.md
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Cikoko SmartApp v2.5.34 (2534) APK + AAB" --notes-file /tmp/cikoko-release-notes.md
          fi
          gh release view "$tag" --json url,assets --jq '{url: .url, filenames: [.assets[].name]}'
      - name: Remove private keystore from build environment
        if: always()
        run: rm -f flutter/android/cikoko_upload.jks
