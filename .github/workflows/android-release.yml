name: Cikoko Native Android Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Validate project
        run: |
          test -f flutter/pubspec.yaml || { echo 'Upload Flutter source ZIP first'; exit 1; }
          cd flutter
          flutter pub get
          flutter analyze
