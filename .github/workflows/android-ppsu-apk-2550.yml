name: Cikoko PPSU 2550 - Direct Signed APK
on:
  push:
    branches: [feat/sync-website-header-android-2549]
    paths: ['.github/workflows/android-ppsu-apk-2550.yml','flutter/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Free build runner disk
        run: |
          for d in /usr/share/dotnet /usr/local/share/powershell /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator; do
            if [ -d "$d" ]; then sudo rm -rf "$d"; fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Verify source and original Android identity
        working-directory: flutter
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name=cikoko .
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          grep -F 'applicationId = "com.KelurahanCikoko.malik"' android/app/build.gradle.kts
          grep -F 'versionCode = 2550' android/app/build.gradle.kts
      - name: Restore and verify original upload signing key
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CIKOKO_KEYSTORE_B64"
          test -n "$CIKOKO_STORE_PASSWORD"
          umask 077
          printf '%s' "$CIKOKO_KEYSTORE_B64" | base64 --decode > flutter/android/cikoko_upload.jks
          actual=$(keytool -list -v -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey |
            grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$actual" = "394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
      - name: Build and sign update APK
        working-directory: flutter
        env:
          CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: androidkey
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          mkdir -p ../cikoko-direct
          signer="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$signer" sign --ks android/cikoko_upload.jks --ks-key-alias androidkey             --ks-pass env:CIKOKO_STORE_PASSWORD --key-pass env:CIKOKO_KEY_PASSWORD             --out ../cikoko-direct/Cikoko-PPSU-v2550-RELEASE-arm64.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$signer" verify --verbose --print-certs ../cikoko-direct/Cikoko-PPSU-v2550-RELEASE-arm64.apk > /tmp/apk-verify.txt
          actual=$(grep -iE 'certificate.*SHA.?256' /tmp/apk-verify.txt |
            grep -oiE '[0-9a-f]{64}|([0-9a-f]{2}:){31}[0-9a-f]{2}' |
            head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$actual" = "394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
      - name: Scan Android APK with ClamAV (fail closed)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout
          clamscan --scan-archive=yes --infected --max-filesize=300M --max-scansize=2000M cikoko-direct/Cikoko-PPSU-v2550-RELEASE-arm64.apk
          (cd cikoko-direct && sha256sum Cikoko-PPSU-v2550-RELEASE-arm64.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Cikoko-PPSU-v2550-SIGNED-APK
          path: cikoko-direct/Cikoko-PPSU-v2550-RELEASE-arm64.apk
          retention-days: 30
          if-no-files-found: error
      - name: Release direct APK file if permitted
        env:
          GH_TOKEN: ${{ secrets.CIKOKO_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v2.5.50-ppsu-apk'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" cikoko-direct/Cikoko-PPSU-v2550-RELEASE-arm64.apk cikoko-direct/SHA256SUMS.txt --clobber || true
          else
            gh release create "$tag" cikoko-direct/Cikoko-PPSU-v2550-RELEASE-arm64.apk cikoko-direct/SHA256SUMS.txt               --target "$GITHUB_SHA" --title 'Cikoko PPSU v2.5.50 (2550) Signed APK' --prerelease               --notes 'Existing applicationId com.KelurahanCikoko.malik. Backend cPanel/SQL v2550 is required. UAT first; QR remains static (not certified TTE).' || true
          fi
      - name: Clear keystore
        if: always()
        run: rm -f flutter/android/cikoko_upload.jks
