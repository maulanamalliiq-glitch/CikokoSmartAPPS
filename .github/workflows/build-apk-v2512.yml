name: Build Cikoko APK TEST 2.5.12 (2512)
on:
  workflow_dispatch:
  push:
    branches: [build/v2512-playstore-aab]
    paths: ['.github/workflows/build-apk-v2512.yml']

permissions:
  contents: write

jobs:
  signed-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Confirm same identity as Play Store AAB
        working-directory: flutter
        run: |
          set -euo pipefail
          grep -q '^version: 2.5.12+2512$' pubspec.yaml
          grep -q 'applicationId = "com.KelurahanCikoko.malik"' android/app/build.gradle.kts
          grep -q 'versionCode = 2512' android/app/build.gradle.kts
          grep -q 'versionName = "2.5.12"' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
      - name: Resolve and test Flutter
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Restore original upload keystore from GitHub Secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CIKOKO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" && -n "$KEY_PASS" ]] || {
            echo "::error::Signing secrets incomplete. Refusing unsigned APK."
            exit 1
          }
          alias_name="${KEY_ALIAS:-androidkey}"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 --decode > flutter/android/app/cikoko-upload.jks
          keytool -list -keystore flutter/android/app/cikoko-upload.jks -storepass "$STORE_PASS" -alias "$alias_name" >/dev/null
          echo "CIKOKO_KEYSTORE_PATH=cikoko-upload.jks" >> "$GITHUB_ENV"
          echo "CIKOKO_KEY_ALIAS=$alias_name" >> "$GITHUB_ENV"
      - name: Build signed universal APK and verify Android signature
        working-directory: flutter
        env:
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release --build-name=2.5.12 --build-number=2512
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          "$apksigner" verify --verbose --print-certs "$apk" > "$GITHUB_WORKSPACE/apk-output/APK_SIGNATURE_VERIFY.txt"
          keytool -exportcert -alias "$CIKOKO_KEY_ALIAS" -keystore "android/app/$CIKOKO_KEYSTORE_PATH" -storepass "$CIKOKO_STORE_PASSWORD" > "$GITHUB_WORKSPACE/apk-output/upload-cert.der"
          expected="$(sha256sum "$GITHUB_WORKSPACE/apk-output/upload-cert.der" | awk '{print $1}')"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$GITHUB_WORKSPACE/apk-output/APK_SIGNATURE_VERIFY.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          test -n "$actual"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::APK signer differs from configured Play upload key."
            exit 1
          }
          cp "$apk" "$GITHUB_WORKSPACE/apk-output/Cikoko-v2512-TEST-UNIVERSAL-SIGNED.apk"
          rm -f "$GITHUB_WORKSPACE/apk-output/upload-cert.der"
          cd "$GITHUB_WORKSPACE/apk-output"
          sha256sum Cikoko-v2512-TEST-UNIVERSAL-SIGNED.apk > APK_SHA256SUMS.txt
          printf 'APK: 2.5.12 (2512)\nApplication: com.KelurahanCikoko.malik\nCertificate SHA256: %s\nVerified by Android SDK apksigner.\n' "$expected" > APK_BUILD_INFO.txt
      - name: Remove upload keystore
        if: always()
        run: rm -f flutter/android/app/cikoko-upload.jks
      - name: Attach APK to existing private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="cikoko-v2.5.12-aab-2512"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null || {
            echo "::error::Expected v2512 draft release does not exist."
            exit 1
          }
          test -s apk-output/Cikoko-v2512-TEST-UNIVERSAL-SIGNED.apk
          gh release upload "$tag" \
            apk-output/Cikoko-v2512-TEST-UNIVERSAL-SIGNED.apk \
            apk-output/APK_SHA256SUMS.txt \
            apk-output/APK_BUILD_INFO.txt \
            apk-output/APK_SIGNATURE_VERIFY.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "Signed test APK attached to existing private draft Release."
